---
name: "Setup Shakespeare"
author: Yevhen Fabizhevskyi
description: |
  This GitHub action installs one of the Shakespeare programming language
  interpreters called shakespearelang. It is installed from the
  fabasoad/shakespearelang fork that supports the latest Python versions.
branding:
  icon: italic
  color: yellow
inputs:
  version:
    description: |
      Git ref (branch, tag or commit SHA) of the fabasoad/shakespearelang fork
      to install. Defaults to "main".
    required: false
    default: "main"
  force:
    description: |
      If "false" skips installation if shakespeare is already installed. If "true"
      installs shakespeare in any case. Defaults to "false".
    required: false
    default: "false"
  github-token:
    description: |
      GitHub token that is used to send requests to GitHub API such as getting
      available python versions. Defaults to the token provided by GitHub Actions
      environment.
    required: false
    default: ${{ github.token }}
outputs:
  installed:
    description: Whether shakespeare was installed or not.
    value: "${{ steps.install-shakespeare.outcome == 'success' }}"
runs:
  using: "composite"
  steps:
    - name: Validate inputs
      env:
        INPUT_VERSION: "${{ inputs.version }}"
        INPUT_FORCE: "${{ inputs.force }}"
      run: ./validate-inputs.sh "${INPUT_VERSION}" "${INPUT_FORCE}"
      shell: sh
      working-directory: ${{ github.action_path }}/src

    - name: Collect info
      id: info
      env:
        INPUT_FORCE: "${{ inputs.force }}"
      run: ./collect-info.sh "${INPUT_FORCE}"
      shell: sh
      working-directory: "${{ github.action_path }}/src"

    - name: Setup Python
      if: steps.info.outputs.bin-installed == 'false'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        token: "${{ inputs.github-token }}"
        python-version: "3.15"

    - name: Upgrade pip
      if: steps.info.outputs.bin-installed == 'false'
      run: python -m pip install --upgrade pip
      shell: sh

    - name: Install dependencies
      if: ${{ steps.info.outputs.bin-installed == 'false' }}
      env:
        SETUPTOOLS_VERSION: "84.2.1"
      run: |
        python -m pip install setuptools==$SETUPTOOLS_VERSION ${{ case(runner.os == 'Windows', 'pyreadline3', '') }}
      shell: sh

    - name: Install Shakespeare
      if: ${{ steps.info.outputs.bin-installed == 'false' }}
      id: install-shakespeare
      env:
        REPO_URL: "https://github.com/fabasoad/shakespearelang"
        VERSION: "${{ inputs.version }}"
      run: python -m pip install "shakespearelang @ git+${REPO_URL}@${VERSION}"
      shell: sh

    - name: Print version
      env:
        VERSION: "${{ inputs.version }}"
      run: echo "shakespeare ${VERSION}"
      shell: sh
