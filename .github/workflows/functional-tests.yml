---
name: Functional Tests

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/functional-tests.yml
      - src/**
      - action.yml
      - hello-world.spl
  schedule:
    # Every Friday at 09:00 JST
    - cron: "0 0 * * 5"
  workflow_dispatch: {}

defaults:
  run:
    shell: sh

jobs:
  run-script:
    name: Run script
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu", "windows", "macos"]
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Setup shakespeare
        id: setup-shakespeare
        uses: ./
      - name: Test action completion
        env:
          STEP_SETUP_SHAKESPEARE_OUTPUT_INSTALLED: "${{ steps.setup-shakespeare.outputs.installed }}"
        run: |
          test_equal() {
            if [ "${2}" != "${3}" ]; then
              echo "::error title=${1}::Expected: ${3}. Actual: ${2}."
              exit 1
            fi
          }
          test_equal "shakespeare should be installed" \
            "${STEP_SETUP_SHAKESPEARE_OUTPUT_INSTALLED}" \
            "true"
          test_equal "Wrong execution output" \
            "$(shakespeare run hello-world.spl)" \
            "Hello World!"
  test-force:
    name: Test force
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        force: ["true", "false"]
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Setup shakespeare 1
        id: setup-shakespeare-1
        uses: ./
      - name: Setup shakespeare 2
        id: setup-shakespeare-2
        uses: ./
        with:
          force: ${{ matrix.force }}
      - name: Test action completion
        env:
          STEP_SETUP_SHAKESPEARE_1_OUTPUT_INSTALLED: "${{ steps.setup-shakespeare-1.outputs.installed }}"
          STEP_SETUP_SHAKESPEARE_2_OUTPUT_INSTALLED: "${{ steps.setup-shakespeare-2.outputs.installed }}"
        run: |
          test_equal() {
            if [ "${2}" != "${3}" ]; then
              echo "::error title=${1}::Expected: ${3}. Actual: ${2}."
              exit 1
            fi
          }
          test_equal "Wrong \"installed\" output from setup-shakespeare-1" \
            "${STEP_SETUP_SHAKESPEARE_1_OUTPUT_INSTALLED}" \
            "true"
          test_equal "Wrong \"installed\" output from setup-shakespeare-2" \
            "${STEP_SETUP_SHAKESPEARE_2_OUTPUT_INSTALLED}" \
            "${{ matrix.force }}"
